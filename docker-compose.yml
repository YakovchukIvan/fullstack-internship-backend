services:
  postgres:
    image: postgres:17.6
    container_name: postgres-developer
    restart: always
    ports:
      - '5432:5432'
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: backend-developer
    restart: always
    ports:
      - '5000:5000'

    env_file:
      - .env

    volumes:
      - .:/app
      - /app/node_modules

    depends_on:
      postgres:
        condition: service_healthy

    command: npm run start:dev

volumes:
  postgres_data:
