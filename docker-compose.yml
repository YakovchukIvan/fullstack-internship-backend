services:
  postgres:
    image: postgres:17.6
    container_name: postgres-developer
    restart: always
    ports:
      - '${POSTGRES_PORT}:5432'
    env_file:
      - .env.development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: redis-developer
    restart: always
    ports:
      - '${REDIS_PORT}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight-developer
    restart: always
    ports:
      - '5540:5540'
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
